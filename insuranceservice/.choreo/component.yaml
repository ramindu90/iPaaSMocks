# WSO2 Cloud - Integration Platform (Devant) source configuration.
# Declares the two REST listeners in this package as separately manageable
# endpoints (each gets its own URL, lifecycle and security settings).
# The MCP server lives in the separate ../insurancemcp integration.
# Both ports are in 8080-8089, so scale-to-zero still works.
schemaVersion: 1.2
endpoints:
  - name: insurance-customer-api
    displayName: Insurance Customer API
    service:
      basePath: /insurance/customer
      port: 8082
    type: REST
    networkVisibilities:
      - Public
      - Project
    schemaFilePath: openapi/customer-api.yaml
  - name: insurance-agent-api
    displayName: Insurance Agent API
    service:
      basePath: /insurance/agent
      port: 8083
    type: REST
    networkVisibilities:
      - Public
      - Project
    schemaFilePath: openapi/agent-api.yaml
